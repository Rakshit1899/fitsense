[project]
name = "fitsense"
version = "0.1.0"
description = "Turn customer reviews into a product-level size and fit signal"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
